name: lock_connect
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/capsule.png
    - assets/lock_animation.mp4
    - assets/animation.gif
    - assets/animations.gif
    - assets/anima.gif

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Italic-VariableFont_wght.ttf
        - asset: assets/fonts/PlayfairDisplay-VariableFont_wght.ttf
          weight: 700
